name: Build Windows exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (for example v1.2.0); leave empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer, MCP bundle and browser extension
        run: npm run build

      - name: Test
        run: npm test

      - name: Package installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: anabranch-windows
          path: release/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist-extension/*.zip
          if-no-files-found: error

      # A pushed v* tag, or a manual run with a release tag (which creates the
      # tag on the commit that was built).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe dist-extension/*.zip --clobber
          else
            gh release create "$TAG" release/*.exe dist-extension/*.zip --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
