name: Build Windows exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (for example v1.2.0); leave empty for a plain build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer, MCP bundle and browser extension
        run: npm run build

      - name: Test
        run: npm test

      - name: Package installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - name: Check the update files exist
        shell: bash
        run: ls release/latest.yml release/*.blockmap

      # Scoop manifest (anabranch.json) and winget manifests for this version.
      - name: Write package-manager manifests
        run: node scripts/package-manifests.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: anabranch-windows
          path: release/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: |
            release/anabranch.json
            release/anabranch-winget-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist-extension/*.zip
          if-no-files-found: error

      # A pushed v* tag, or a manual run with a release tag (which creates the
      # tag on the commit that was built).
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        # latest.yml and the .blockmap are what installed copies read to
        # update themselves (electron-updater).
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then echo "Tag $TAG does not match package.json ($version)"; exit 1; fi
          files=(release/*.exe release/latest.yml release/*.blockmap release/anabranch.json release/anabranch-winget-*.zip dist-extension/*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
